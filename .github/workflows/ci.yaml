name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  testes-unitarios:
    name: Testes Unitários (Python)
    runs-on: ubuntu-latest
    
    env:
      DB_PASSWORD: "ci_fake_password"
      DB_USER: "postgres"
      DB_NAME: "biblioteca"
      REDIS_HOST: "localhost"

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi pydantic

      - name: Executar Testes Unitários com Pytest
        run: |
          python -m pytest

  test-ts:
    name: Testes TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: politica-prazo-ts/package-lock.json

      - name: Instalar dependências (npm ci)
        working-directory: politica-prazo-ts
        run: npm ci

      - name: Rodar testes (Vitest)
        working-directory: politica-prazo-ts
        run: npm test

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Compilar e construir (tsc e vite build)
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm run build

  integracao:
    name: Testes de Integração e Cache
    runs-on: ubuntu-latest
    
    needs: [testes-unitarios, test-ts, frontend]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_fake_password
          POSTGRES_DB: biblioteca
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: "ci_fake_password"
      DB_NAME: biblioteca
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r arquitetura/requirements.txt
          python -m pip install psycopg2-binary requests

      - name: Aguardar e Carregar Schema SQL
        run: |
          python -c "
          import time, psycopg2
          for i in range(15):
              try:
                  conn = psycopg2.connect(host='localhost', database='biblioteca', user='postgres', password='ci_fake_password')
                  conn.close()
                  print('Banco pronto!')
                  break
              except Exception as e:
                  print('Aguardando banco...', e)
                  time.sleep(2)
          "
          PGPASSWORD="$DB_PASSWORD" psql -h localhost -U "$DB_USER" -d "$DB_NAME" -f biblioteca_schema.sql

      - name: Subir Servico-Prazo em Background e Aguardar
        working-directory: arquitetura
        run: |
          python main.py &
          for i in {1..15}; do
            curl -sf http://127.0.0.1:8001/ && break
            sleep 1
          done

      - name: Executar Testes de Integração
        working-directory: arquitetura
        run: pytest -m integracao

      - name: Executar Testes de Cache (Redis)
        working-directory: arquitetura
        run: python testar_cache_fluxo.py