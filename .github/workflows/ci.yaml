name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  testes-unitarios:
    name: Testes Unitários (Python)
    runs-on: ubuntu-latest
    
    # Adicionamos as variáveis para passar nas validações de importação do código
    env:
      DB_PASSWORD: "ci_fake_password"
      DB_USER: "postgres"
      DB_NAME: "biblioteca"
      REDIS_HOST: "localhost"

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi pydantic
          # Se houver outras dependências core necessárias, instale individualmente ou limpe o requirements.txt geral deste job
      - name: Executar Testes Unitários com Pytest
        run: |
          python -m pytest